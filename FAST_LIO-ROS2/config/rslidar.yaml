/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/front/rslidar_points"    # bag point cloud; live rslidar_sdk uses /rslidar_points
            imu_topic:  "/gps_imu"                 # sensor_msgs/Imu converted from /gps_data
                                                   # Live RSM1 does not publish IMU. RSAIRY / RSE1 need
                                                   # ENABLE_IMU_DATA_PARSE=ON and a non-zero imu_port.
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # 1 RoboSense rslidar_sdk PointCloud2 (XYZIRT), 2 Velodyne, 3 Ouster, 4 Livox PointCloud2
            scan_line:  5                # RSM1 has 5 channels; set this to the lidar line count (RS16=16, RS32=32, ...)
            blind: 0.5
            timestamp_unit: 0            # unused for lidar_type 1; per-point timestamp is absolute seconds
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    120.0         # RSM1 horizontal FOV
            det_range:     200.0
            extrinsic_est_en:  true
            extrinsic_T: [ 0., 0., 0. ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
